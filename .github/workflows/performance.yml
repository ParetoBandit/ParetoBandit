name: Performance and Stress

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  stress-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      - name: Run stress tests (fast subset)
        run: |
          pytest tests/ -m "stress and not slow" -v --tb=short

      - name: Run package integrity stress test
        run: |
          pytest tests/test_package_data_integrity.py -v --tb=short

      - name: Run local performance budget test
        env:
          RUN_PERFORMANCE_TESTS: "1"
          BANDITGPT_PERF_ROUNDS: "2500"
          BANDITGPT_PERF_WARMUP: "250"
        run: |
          pytest tests/test_performance_baseline.py -v --tb=short

      - name: Benchmark against external routers
        run: |
          python scripts/benchmark_external_bandits.py \
            --rounds 2000 \
            --warmup-rounds 200 \
            --strict \
            --output-json benchmark-results/external_bandits.json \
            --output-md benchmark-results/external_bandits.md

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
