[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banditgpt"
version = "0.1.0"
description = "A local-first, adaptive router for intelligent LLM model selection using contextual bandits"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Annette Taberner-Miller" }
]
keywords = [
    "llm",
    "router",
    "bandit",
    "machine-learning",
    "model-selection",
    "contextual-bandit",
    "linucb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
# Sentence-transformer embeddings (pulls in torch + transformers)
embeddings = [
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
]
# Individual provider extras
openrouter = ["openai>=1.0.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
gemini = ["google-genai>=1.0.0"]
ollama = ["ollama>=0.1.0"]
# Full functionality (all providers + embeddings + utilities)
full = [
    "banditgpt[embeddings]",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0",
]
# Priors/data helpers (keeps core deps slim; may add fetch tooling later)
data = []
# Experiments (paper reproduction)
experiments = [
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=1.2.0",
]
bench = [
    "mabwiser>=2.7.4",
    "contextualbandits>=0.3.27",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/atabernermiller/banditgpt"
Documentation = "https://github.com/atabernermiller/banditgpt#readme"
Repository = "https://github.com/atabernermiller/banditgpt.git"
Issues = "https://github.com/atabernermiller/banditgpt/issues"

[project.scripts]
banditgpt = "bandit_gpt.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src/bandit_gpt",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bandit_gpt"]

[tool.hatch.build.targets.wheel.force-include]
"src/bandit_gpt/data" = "bandit_gpt/data"
"src/bandit_gpt/py.typed" = "bandit_gpt/py.typed"

# --- Testing ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "stress: marks stress and soak-style validation tests",
    "performance: marks performance benchmark and regression tests",
    "live: marks tests that make real API calls (require API keys in .env)",
]

# --- Code Quality ---
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["bandit_gpt"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
