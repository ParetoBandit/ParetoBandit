[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banditgpt"
version = "0.1.0"
description = "A local-first, adaptive router for intelligent LLM model selection using contextual bandits"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Annette Taberner-Miller", email = "annette@example.com" }
]
keywords = [
    "llm",
    "router",
    "bandit",
    "machine-learning",
    "model-selection",
    "contextual-bandit",
    "linucb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# Full functionality (LLM-as-judge grading, API integration)
full = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]
# Priors/data helpers (keeps core deps slim; may add fetch tooling later)
data = []
# Experiments (KDD paper reproduction)
experiments = [
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/atabernermiller/banditgpt"
Documentation = "https://github.com/atabernermiller/banditgpt#readme"
Repository = "https://github.com/atabernermiller/banditgpt.git"
Issues = "https://github.com/atabernermiller/banditgpt/issues"

[project.scripts]
banditgpt = "banditgpt.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/banditgpt",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["banditgpt"]

# Include data files in the wheel (they are inside the package now)
[tool.hatch.build.targets.wheel.force-include]
"banditgpt/data" = "banditgpt/data"

# --- Testing ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# --- Code Quality ---
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["banditgpt"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
